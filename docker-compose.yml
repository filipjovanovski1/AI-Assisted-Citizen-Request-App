services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ddukoski/cra:latest
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-min-32-chars!!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://citizen-requests.duko-7.workers.dev}
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - cra-uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy
  web:
    image: ddukoski/cra-ui:latest
    container_name: nginx_web
    working_dir: /web
    ports:
      - "80:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./nginx-cache:/var/cache/nginx
    depends_on:
      - api

volumes:
  pgdata:
  cra-uploads:
