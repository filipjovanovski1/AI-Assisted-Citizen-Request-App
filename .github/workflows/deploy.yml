name: AI Citizen Platform Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-api:
    name: Deploy API (Docker Hub)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & push image
        uses: ./.github/actions/docker-build-push
        with:
          ctx: './api'
          tag: 'ddukoski/cra:latest'
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image (local CORS)
        uses: ./.github/actions/docker-build-push
        with:
          ctx: './api'
          tag: 'ddukoski/cra-local-cors:latest'
          build_args: 'CORS_ALLOWED_ORIGINS=http://localhost:5173'
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy-web:
    name: Deploy Web (Cloudflare Workers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Build web
        run: npm --prefix web run build

      - name: Build & push image
        uses: ./.github/actions/docker-build-push
        with:
          ctx: './api'
          tag: 'ddukoski/cra-ui:latest'
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
