name: AI Citizen Platform CI Pipeline

on:
  push:

jobs:
  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Lint web
        run: npm --prefix web run lint

  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Maven
        run: mvn -version

      - name: Lint api
        run: mvn -f api/pom.xml spotless:check

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [lint-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Build web
        run: npm --prefix web run build

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: [lint-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Maven
        run: mvn -version

      - name: Build api
        run: mvn -f api/pom.xml -DskipTests package
