spring.application.name=AIAssitedCitizenRequestApplication

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:citizen_requests_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

ai.openai.api-key=${AI_OPENAI_API_KEY:}
ai.openai.model=${AI_OPENAI_MODEL:gpt-4o-mini}

# Dev fallback — override JWT_SECRET with a strong value in production.
jwt.secret=${JWT_SECRET:change-this-secret-in-production-min-32-chars!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
